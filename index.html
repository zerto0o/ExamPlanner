<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик подготовки к экзаменам</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Exam Planner</div>
        <nav>
            <button class="nav-btn active" data-section="examsSection">Экзамены</button>
            <button class="nav-btn" data-section="calendarSection">Календарь</button>
            <button class="nav-btn" data-section="statsSection">Статистика</button>
        </nav>
    </header>

    <!--Экзамены-->
    <section id="examsSection" class="section active">
        <h2>Мои экзамены</h2>

        <div class="form-card">
            <h3>Добавить экзамен</h3>
            <form id="examForm" novalidate>
                <div class="form-group">
                    <label for="examName">Название</label>
                    <input type="text" id="examName">
                    <div id="examNameError" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="examDate">Дата</label>
                    <input type="date" id="examDate">
                    <div id="examDateError" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="examDesc">Описание</label>
                    <textarea id="examDesc" rows="2" placeholder="Дополнительная информация"></textarea>
                </div>
                <button type="submit" class="btn">Создать экзамен</button>
            </form>
        </div>

        <div id="examsListContainer" class="exams-grid"></div>

        <div id="examDetail" class="form-card" style="display: none;">
            <div class="detail-header">
                <div>
                    <h3 id="detailName" style="margin-bottom: 4px;"></h3>
                    <div id="detailDate" class="text-muted"></div>
                </div>
                <div class="flex-row">
                    <button id="deleteExamBtn" class="btn btn-danger btn-small">Удалить экзамен</button>
                </div>
            </div>
            <div class="progress-bar-container" style="margin: 12px 0;">
                <div id="detailProgressFill" class="progress-fill" style="width: 0%;"></div>
            </div>
            <div id="detailProgressText" class="text-muted" style="margin-bottom: 18px;"></div>
            <h4>Темы для подготовки</h4>
            <div id="topicsList" class="topics-list"></div>

            <form id="topicForm" class="add-topic-form" novalidate>
                <input type="text" id="topicName" placeholder="Новая тема">
                <button type="submit" class="btn btn-small">Добавить тему</button>
            </form>
            <div id="topicNameError" class="error"></div>
        </div>
    </section>

    <!--Календарь-->
    <section id="calendarSection" class="section">
        <h2>Календарь экзаменов</h2>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div id="calendarEmpty" class="empty-message">Нет экзаменов для отображения</div>
    </section>

    <!--Статистика-->
    <section id="statsSection" class="section">
        <h2>Статистика подготовки</h2>
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-value" id="statOverallProgress">0%</div>
                <div class="stat-label">Общая готовность (все экзамены)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statExamsCount">0</div>
                <div class="stat-label">Всего экзаменов</div>
            </div>
        </div>
        <h3>Ближайшие экзамены</h3>
        <ul id="upcomingExamsList" class="upcoming-list"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
